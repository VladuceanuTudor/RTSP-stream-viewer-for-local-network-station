# MediaMTX Configuration pentru RTSP 360°
logLevel: info
logDestinations: [stdout]

# API
api: yes
apiAddress: :9997

# Metrics
metrics: yes
metricsAddress: :9998

# RTSP
rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]

# WebRTC
webrtc: yes
webrtcAddress: :8889

# HLS
hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'

# Paths
paths:
  jetson360:
    source: publisher